$mainMod = SUPER
$terminal = kitty
$browser = firefox
$fileManager = thunar
$menu = /home/haunted/.local/bin/noctalia-ipc launcher toggle
#$menu = rofi -show drun

monitor=,preferred,auto,1

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24

exec-once = hyprctl setcursor Bibata-Modern-Ice 24
#exec-once = waybar
exec-once = systemctl --user start noctalia-shell.service
exec-once = nm-applet --indicator

input {
    kb_layout = de

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        disable_while_typing = true
    }

    touchdevice {
        enabled = true
        output = eDP-1
    }

    tablet {
        output = eDP-1
    }
}

cursor {
    hide_on_touch = true
    hide_on_tablet = true
}

gestures {
    workspace_swipe_touch = true
    workspace_swipe_touch_invert = false
    workspace_swipe_direction_lock = true
    workspace_swipe_cancel_ratio = 0.35
    workspace_swipe_distance = 280
    workspace_swipe_min_speed_to_force = 20
}

gesture = 3, horizontal, workspace

general {
gaps_in = 1.5
gaps_out = 2.7
border_size = 1
col.active_border = rgba(7dd3faff)
col.inactive_border = rgba(1e293bcc)
#layout = dwindle
}

decoration {
rounding = 5
active_opacity = 0.95
inactive_opacity = 0.90

blur {
    enabled = true
    size = 5
    passes = 2
    vibrancy = 0.15
    xray = true
    special = false
    popups = false
}

shadow {
    enabled = true
    range = 12
    render_power = 3
}

}

animations {
enabled = true

bezier = easeOutQuint,0.23,1,0.32,1
animation = windows, 1, 5, easeOutQuint
animation = border, 1, 8, default
animation = fade, 1, 5, default
animation = workspaces, 1, 4, default

}

#dwindle {
#pseudotile = true
#preserve_split = true
#}

misc {
force_default_wallpaper = 0
disable_hyprland_logo = true
}

#Main binds

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, D, exec, $menu
bind = $mainMod, C, exec, /home/haunted/.local/bin/noctalia-ipc controlCenter toggle
bind = $mainMod, N, exec, /home/haunted/.local/bin/noctalia-ipc notifications toggleHistory
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, M, exec, /home/haunted/.local/bin/noctalia-ipc sessionMenu toggle
bind = $mainMod SHIFT, M, exit
bind = $mainMod, E, exec, $fileManager

#Screenshots

bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -

#Workspaces

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Switch workspace with Super + arrow keys
bind = $mainMod, right, workspace, e+1
bind = $mainMod, left, workspace, e-1

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

#Floating / Mango-like workflow

bind = $mainMod, Space, togglefloating
bind = $mainMod SHIFT, Space, exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 75% 75%; dispatch centerwindow"

#Pseudo/tile behavior

bind = $mainMod, P, pseudo
#bind = $mainMod, J, layoutmsg, togglesplit

#Groups / tabbed-ish behavior

bind = $mainMod, G, togglegroup
bind = $mainMod, Tab, changegroupactive, f

#Mouse floating controls

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#Laptop function keys

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
